<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thread Shear Stress — Mechanical Calculation Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app" id="appHeader"></header>
<nav class="crumbs" id="appNav"></nav>
<main>
<div id="globalError" class="errorbox"></div>
<div class="card"><h2>Thread Shear Stress — Machinery's Handbook, 27th Ed.</h2>
<div id="formulaBox"></div>
<div class="grid">
<div class="field"><label>Thread designation</label><input id="th_designation"></div>
<div class="field"><label>Applied axial load, F (kip)</label><input type="number" id="th_load" step="any"></div>
<div class="field"><label>Threads per inch, n (TPI)</label><input type="number" id="th_tpi" step="any"></div>
<div class="field"><label>Tensile stress area of external thread, At (in²)</label><input type="number" id="th_at" step="any"></div>
<div class="field"><label>Maximum minor diameter of internal thread, Kn max (in)</label><input type="number" id="th_knmax" step="any"></div>
<div class="field"><label>Maximum pitch diameter of internal thread, En max (in)</label><input type="number" id="th_enmax" step="any"></div>
<div class="field"><label>Minimum pitch diameter of external thread, Es min (in)</label><input type="number" id="th_esmin" step="any"></div>
<div class="field"><label>Minimum major diameter of external thread, Ds min (in)</label><input type="number" id="th_dsmin" step="any"></div>
<div class="field"><label>Actual length of engagement, Lm (in)</label><input type="number" id="th_lm" step="any"></div>
<div class="field"><label>External thread shear allowable, Sallow,s (ksi)</label><input type="number" id="th_extallow" step="any"></div>
<div class="field"><label>Internal thread shear allowable, Sallow,n (ksi)</label><input type="number" id="th_intallow" step="any"></div>
</div>
<p><button class="calcbtn" onclick="calcThread()">Calculate Thread Shear</button></p>
<div id="results" class="results"></div>
<div id="sheet"></div>
<p class="jump"><a href="calculation-report.html"><button class="ghost">View in Calculation Report</button></a></p>
</div>
</main>
<div class="footer">Prototype engineering aid. Results require independent engineering verification.</div>
<script src="shared.js"></script>
<script>
const {v:V,q:Q,r:R,f:Fr,p:Pw,br:Br,o:Op,n:Nm,c:Ct,fn:Fn,tx:Tx}=M;const PI=M.pi;
const val=id=>document.getElementById(id).value;
const num=id=>Number(val(id));
function restoreInputs(fields){const d=loadData(),inp=d.inputs||{};fields.forEach(id=>{if(inp[id]!==undefined)document.getElementById(id).value=inp[id]})}
function persistInputs(){const d=loadData();d.inputs=d.inputs||{};FIELDS.forEach(id=>d.inputs[id]=val(id));saveData(d)}

const FIELDS=['th_designation','th_load','th_tpi','th_at','th_knmax','th_enmax','th_esmin','th_dsmin','th_lm','th_extallow','th_intallow'];
const RULES=[
 {id:'th_load',label:'Applied axial load (F)',min:0},
 {id:'th_tpi',label:'Threads per inch (n)',exclusiveMin:0,max:80},
 {id:'th_at',label:'Tensile stress area (At)',exclusiveMin:0},
 {id:'th_knmax',label:'Kn max',exclusiveMin:0,max:60},
 {id:'th_enmax',label:'En max',exclusiveMin:0,max:60},
 {id:'th_esmin',label:'Es min',exclusiveMin:0,max:60},
 {id:'th_dsmin',label:'Ds min',exclusiveMin:0,max:60},
 {id:'th_lm',label:'Actual length of engagement (Lm)',required:false,min:0},
 {id:'th_extallow',label:'External thread shear allowable',exclusiveMin:0,max:400},
 {id:'th_intallow',label:'Internal thread shear allowable',exclusiveMin:0,max:400}];
const MHB="Machinery's Handbook 27th Ed.";
const Kn=V('K','n,max'),En=V('E','n,max'),Es=V('E','s,min'),Ds=V('D','s,min'),Le=V('L','e'),As=V('A','s'),An=V('A','n');
const half2n=Fr(Nm(1),R(Nm(2),Op('·'),V('n')));
const EQ={
 Le:Fr(R(Nm(2),Op('·'),V('A','t')),R(PI,Op('·'),Kn,Op('·'),Br(R(Fr(Nm(1),Nm(2)),Op('+'),Nm('0.57735'),Op('·'),V('n'),Op('·'),Br(R(Es,Op('−'),Kn))),'['))),
 As:R(PI,Op('·'),V('n'),Op('·'),Le,Op('·'),Kn,Op('·'),Br(R(half2n,Op('+'),Nm('0.57735'),Op('·'),Br(R(Es,Op('−'),Kn))),'[')),
 An:R(PI,Op('·'),V('n'),Op('·'),Le,Op('·'),Ds,Op('·'),Br(R(half2n,Op('+'),Nm('0.57735'),Op('·'),Br(R(Ds,Op('−'),En))),'[')),
 ts:Fr(V('F'),As),tn:Fr(V('F'),An),
 us:Fr(V('τ','s'),V('S','allow,s')),un:Fr(V('τ','n'),V('S','allow,n')),
 uf:Fn('max',R(V('UF','s'),Op(','),V('UF','n')))
};
renderFormulaBox('formulaBox',[
 {lhs:Le,eq:EQ.Le,ref:MHB+', Formula (1)'},
 {lhs:As,eq:EQ.As,ref:MHB+', Formula (5)'},
 {lhs:An,eq:EQ.An,ref:MHB+', Formula (6)'},
 {lhs:V('τ','s'),eq:EQ.ts,ref:'External thread shear stress'},
 {lhs:V('τ','n'),eq:EQ.tn,ref:'Internal thread shear stress'}]);
function resultsHTML(r){
 const g=s=>r.vars.find(v=>v.symbol===s).value;const lm=g('Lm');
 return box('Required Length of Engagement (Lₑ)',fmt(g('Le'),4),'in')
 +(lm!==''?box('Engagement Check (Lm ≥ Lₑ)',Number(lm)>=g('Le')?'ADEQUATE':'INSUFFICIENT'):'')
 +box('External Thread Shear Area (Aₛ)',fmt(g('As'),4),'in²')+box('Internal Thread Shear Area (Aₙ)',fmt(g('An'),4),'in²')
 +box('External Thread Shear Stress (τₛ)',fmt(g('τs'),4),'ksi')+box('Internal Thread Shear Stress (τₙ)',fmt(g('τn'),4),'ksi')
 +box('Governing UF',fmt(r.uf))+sbox(r.status)+ufGauge(r.uf);
}
function calcThread(){
 if(!validateForm(RULES).ok)return false;
 const F=num('th_load'),n=num('th_tpi'),At=num('th_at'),kn=num('th_knmax'),en=num('th_enmax'),es=num('th_esmin'),ds=num('th_dsmin'),Se=num('th_extallow'),Si=num('th_intallow');
 const hasLm=val('th_lm')!=='',Lm=num('th_lm');
 if(!(kn<es)){showError('Es min must be greater than Kn max.');return false}
 if(!(en<ds)){showError('Ds min must be greater than En max.');return false}
 const le=2*At/(Math.PI*kn*(0.5+0.57735*n*(es-kn)));
 const as=Math.PI*n*le*kn*(1/(2*n)+0.57735*(es-kn)), an=Math.PI*n*le*ds*(1/(2*n)+0.57735*(ds-en));
 const ts=F/as,tn=F/an,us=ts/Se,un=tn/Si,uf=Math.max(us,un);
 const vars=[
  variable('Thread','Thread designation',val('th_designation'),'','input',Tx('Thread')),
  variable('F','Applied axial load',F,'kip','input',V('F')),
  variable('n','Threads per inch',n,'in⁻¹','input',V('n')),
  variable('At','Tensile stress area of external thread',At,'in²','input',V('A','t')),
  variable('Kn','Maximum minor diameter of internal thread',kn,'in','input',Kn),
  variable('En','Maximum pitch diameter of internal thread',en,'in','input',En),
  variable('Es','Minimum pitch diameter of external thread',es,'in','input',Es),
  variable('Ds','Minimum major diameter of external thread',ds,'in','input',Ds),
  variable('Lm','Actual length of engagement',hasLm?Lm:'','in','input',V('L','m')),
  variable('Ss','External thread shear allowable',Se,'ksi','input',V('S','allow,s')),
  variable('Sn','Internal thread shear allowable',Si,'ksi','input',V('S','allow,n')),
  variable('Le','Required length of engagement',le,'in','calculated'),variable('As','External thread shear area',as,'in²','calculated'),
  variable('An','Internal thread shear area',an,'in²','calculated'),variable('τs','External thread shear stress',ts,'ksi','calculated'),
  variable('τn','Internal thread shear stress',tn,'ksi','calculated'),variable('UF','Governing utilization factor',uf,'-','calculated')];
 const h2n=Fr(Nm(1),R(Nm(2),Op('·'),Q(n,'in⁻¹')));
 const steps=[
  step('Required length of engagement',Le,EQ.Le,
   Fr(R(Nm(2),Op('·'),Q(At,'in²')),R(PI,Op('·'),Q(kn,'in'),Op('·'),Br(R(Fr(Nm(1),Nm(2)),Op('+'),Nm('0.57735'),Op('·'),Q(n,'in⁻¹'),Op('·'),Br(R(Q(es,'in'),Op('−'),Q(kn,'in')))),'['))),
   Q(le,'in'),MHB+', Formula (1)'),
  step('Shear area of external threads',As,EQ.As,
   R(PI,Op('·'),Q(n,'in⁻¹'),Op('·'),Q(le,'in'),Op('·'),Q(kn,'in'),Op('·'),Br(R(h2n,Op('+'),Nm('0.57735'),Op('·'),Br(R(Q(es,'in'),Op('−'),Q(kn,'in')))),'[')),
   Q(as,'in²'),MHB+', Formula (5)'),
  step('Shear area of internal threads',An,EQ.An,
   R(PI,Op('·'),Q(n,'in⁻¹'),Op('·'),Q(le,'in'),Op('·'),Q(ds,'in'),Op('·'),Br(R(h2n,Op('+'),Nm('0.57735'),Op('·'),Br(R(Q(ds,'in'),Op('−'),Q(en,'in')))),'[')),
   Q(an,'in²'),MHB+', Formula (6)')];
 if(hasLm)steps.push(step('Length of engagement check',null,R(V('L','m'),Op('≥'),Le),R(Q(Lm,'in'),Op(Lm>=le?'≥':'<'),Q(le,'in')),Tx(Lm>=le?'ADEQUATE':'INSUFFICIENT — increase engagement length')));
 steps.push(
  step('External thread shear stress',V('τ','s'),EQ.ts,Fr(Q(F,'kip'),Q(as,'in²')),Q(ts,'ksi')),
  step('Internal thread shear stress',V('τ','n'),EQ.tn,Fr(Q(F,'kip'),Q(an,'in²')),Q(tn,'ksi')),
  step('External thread utilization',V('UF','s'),EQ.us,Fr(Q(ts,'ksi'),Q(Se,'ksi')),Nm(us,3)),
  step('Internal thread utilization',V('UF','n'),EQ.un,Fr(Q(tn,'ksi'),Q(Si,'ksi')),Nm(un,3)),
  step('Governing utilization',V('UF'),EQ.uf,Fn('max',R(Nm(us,3),Op(','),Nm(un,3))),R(Nm(uf,3),Op('→'),Tx(status(uf)))));
 const result={name:"Thread shear stress (Machinery's Handbook)",demand:Math.max(ts,tn),allowable:us>=un?Se:Si,uf,unit:'ksi',status:status(uf),vars,steps};
 show(result);saveModuleResult('thread',result);persistInputs();return true;
}

function show(result){document.getElementById('results').innerHTML=resultsHTML(result);document.getElementById('sheet').innerHTML=detailedSection('thread',result)}
function restore(){restoreInputs(FIELDS);const s=(loadData().results||{}).thread;if(s)show(s)}
renderChrome('thread');
markRequiredFields(RULES);restore();
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',persistInputs));
</script>
</body>
</html>
