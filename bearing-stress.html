<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bearing Stress — Mechanical Calculation Toolkit</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app" id="appHeader"></header>
<nav class="crumbs" id="appNav"></nav>
<main>
<div id="globalError" class="errorbox"></div>
<div class="card"><h2>Bearing Stress</h2>
<div class="formula">σ<sub>b</sub> = F ÷ A<sub>p</sub></div>
<div class="grid">
<div class="field"><label>Bearing/contact force (kip) *</label><input type="number" id="br_force" step="any"></div>
<div class="field"><label>Projected bearing area (in²) *</label><input type="number" id="br_area" step="any"></div>
<div class="field"><label>Allowable bearing stress (ksi) *</label><input type="number" id="br_allow" step="any"></div>
<div class="field"><label>Area basis / description</label><input id="br_basis"></div>
</div>
<p><button class="calcbtn" onclick="calcBearing()">Calculate Bearing Stress</button></p>
<div id="br_results" class="results"></div>
<p class="jump"><a href="calculation-report.html"><button class="ghost">View in Calculation Report</button></a></p>
</div>
</main>
<div class="footer">Prototype engineering aid. Results require independent engineering verification.</div>
<script src="shared.js"></script>
<script>
const FIELDS=['br_force','br_area','br_allow','br_basis'];
function restore(){const d=loadData();const inputs=(d.inputs||{});FIELDS.forEach(id=>{if(inputs[id]!==undefined)document.getElementById(id).value=inputs[id]});const saved=(d.results||{}).bearing;if(saved)document.getElementById('br_results').innerHTML=box('Bearing stress',fmt(saved.demand,4),'ksi')+box('Allowable',fmt(saved.allowable),'ksi')+box('UF',fmt(saved.uf))+sbox(saved.status)}
function persistInputs(){const d=loadData();d.inputs=d.inputs||{};FIELDS.forEach(id=>d.inputs[id]=document.getElementById(id).value);saveData(d)}
function calcBearing(){
 if(!validPairs([['br_force','Bearing force','nonnegative'],['br_area','Bearing area','positive'],['br_allow','Bearing allowable','positive']]))return false;
 const F=Number(document.getElementById('br_force').value),A=Number(document.getElementById('br_area').value),allow=Number(document.getElementById('br_allow').value);
 const stress=F/A,uf=stress/allow;
 const vars=[variable('F','Bearing / Contact Force',F,'kip','input'),variable('Aₚ','Projected Bearing Area',A,'in²','input'),variable('Sallow','Allowable Bearing Stress',allow,'ksi','input'),variable('Basis','Area Basis / Description',document.getElementById('br_basis').value,'','input'),variable('σb','Calculated Bearing Stress',stress,'ksi','calculated'),variable('UF','Utilization Factor',uf,'-','calculated')];
 const steps=[step('Bearing stress','σb = F ÷ Aₚ',`σb = ${F} ÷ ${A}`,`σb = ${fmt(stress,4)} ksi`),step('Utilization','UF = σb ÷ Sallow',`UF = ${fmt(stress,4)} ÷ ${allow}`,`UF = ${fmt(uf,3)} → ${status(uf)}`)];
 document.getElementById('br_results').innerHTML=box('Bearing stress',fmt(stress,4),'ksi')+box('Allowable',fmt(allow),'ksi')+box('UF',fmt(uf))+sbox(status(uf));
 saveModuleResult('bearing',{name:'Bearing stress',demand:stress,allowable:allow,uf,unit:'ksi',status:status(uf),vars,steps});
 persistInputs();
 return true;
}
renderChrome('bearing');
restore();
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',persistInputs));
</script>
</body>
</html>
