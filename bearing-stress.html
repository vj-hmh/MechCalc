<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bearing Stress — Mechanical Calculation Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app" id="appHeader"></header>
<nav class="crumbs" id="appNav"></nav>
<main>
<div id="globalError" class="errorbox"></div>
<div class="card"><h2>Bearing Stress</h2>
<div class="formula">Bearing Stress: σ<sub>b</sub> = F ÷ A<sub>p</sub><br>Utilization Factor: UF = σ<sub>b</sub> ÷ S<sub>allow</sub></div>
<div class="grid">
<div class="field"><label>Bearing/contact force, F (kip)</label><input type="number" id="br_force" step="any"></div>
<div class="field"><label>Projected bearing area, Ap (in²)</label><input type="number" id="br_area" step="any"></div>
<div class="field"><label>Allowable bearing stress, Sallow (ksi)</label><input type="number" id="br_allow" step="any"></div>
<div class="field"><label>Area basis / description</label><input id="br_basis"></div>
</div>
<p><button class="calcbtn" onclick="calcBearing()">Calculate Bearing Stress</button></p>
<div id="br_results" class="results"></div>
<p class="jump"><a href="calculation-report.html"><button class="ghost">View in Calculation Report</button></a></p>
</div>
</main>
<div class="footer">Prototype engineering aid. Results require independent engineering verification.</div>
<script src="shared.js"></script>
<script>
const FIELDS=['br_force','br_area','br_allow','br_basis'];
const RULES=[
 {id:'br_force',label:'Bearing/contact force',min:0},
 {id:'br_area',label:'Projected bearing area',exclusiveMin:0},
 {id:'br_allow',label:'Allowable bearing stress',exclusiveMin:0,max:400}
];
const val=id=>document.getElementById(id).value;
function resultsHTML(r){return box('Bearing Stress (σb)',fmt(r.demand,4),'ksi')+box('Allowable (Sallow)',fmt(r.allowable),'ksi')+box('Utilization Factor (UF)',fmt(r.uf))+sbox(r.status)+ufGauge(r.uf)}
function restore(){const d=loadData();const inputs=(d.inputs||{});FIELDS.forEach(id=>{if(inputs[id]!==undefined)document.getElementById(id).value=inputs[id]});const saved=(d.results||{}).bearing;if(saved)document.getElementById('br_results').innerHTML=resultsHTML(saved)}
function persistInputs(){const d=loadData();d.inputs=d.inputs||{};FIELDS.forEach(id=>d.inputs[id]=val(id));saveData(d)}
function calcBearing(){
 if(!validateForm(RULES).ok)return false;
 const F=Number(val('br_force')),A=Number(val('br_area')),allow=Number(val('br_allow'));
 const stress=F/A,uf=stress/allow;
 const vars=[variable('F','Bearing / Contact Force',F,'kip','input'),variable('Aₚ','Projected Bearing Area',A,'in²','input'),variable('Sallow','Allowable Bearing Stress',allow,'ksi','input'),variable('Basis','Area Basis / Description',val('br_basis'),'','input'),variable('σb','Bearing Stress',stress,'ksi','calculated'),variable('UF','Utilization Factor',uf,'-','calculated')];
 const steps=[
  step('Bearing Stress','σb = F ÷ Aₚ',`σb = ${F} kip ÷ ${A} in²`,`σb = ${fmt(stress,4)} ksi`),
  step('Utilization Factor','UF = σb ÷ Sallow',`UF = ${fmt(stress,4)} ksi ÷ ${allow} ksi`,`UF = ${fmt(uf,3)} → ${status(uf)}`)];
 const result={name:'Bearing stress',demand:stress,allowable:allow,uf,unit:'ksi',status:status(uf),vars,steps};
 document.getElementById('br_results').innerHTML=resultsHTML(result);
 saveModuleResult('bearing',result);
 persistInputs();
 return true;
}
renderChrome('bearing');
markRequiredFields(RULES);
restore();
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',persistInputs));
</script>
</body>
</html>
