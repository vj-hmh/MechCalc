<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Information — Mechanical Calculation Toolkit</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app" id="appHeader"></header>
<nav class="crumbs" id="appNav"></nav>
<main>
<div class="card"><h2>Project Information</h2><div class="grid">
<div class="field"><label>Calculation title *</label><input id="p_title" value="Mechanical Calculation Report (US units)"></div>
<div class="field"><label>Calculation number</label><input id="p_number" placeholder="HO26-XXX"></div>
<div class="field"><label>Revision</label><input id="p_rev" value="01"></div>
<div class="field"><label>Project</label><input id="p_project"></div>
<div class="field"><label>Equipment / Assembly</label><input id="p_equipment"></div>
<div class="field"><label>Component / Part number</label><input id="p_component"></div>
<div class="field"><label>Drawing / Revision</label><input id="p_drawing"></div>
<div class="field"><label>Prepared by</label><input id="p_prepared"></div>
<div class="field"><label>Checked by</label><input id="p_checked"></div>
<div class="field"><label>Date</label><input type="date" id="p_date"></div>
<div class="field"><label>Design standard / basis</label><input id="p_standard"></div>
<div class="field"><label>Load case</label><input id="p_loadcase" value="LC1"></div>
</div></div>
<div class="card"><h3>References and assumptions</h3><div class="grid">
<div class="field"><label>Reference documents</label><textarea id="p_refs" placeholder="One reference per line"></textarea></div>
<div class="field"><label>Assumptions and limitations</label><textarea id="p_assumptions" placeholder="Document all assumptions"></textarea></div>
</div>
<div class="savebar"><button onclick="saveProject()">Save Project Information</button><span class="savedmsg" id="savedMsg">Saved</span></div>
</div>
</main>
<div class="footer">Prototype engineering aid. Results require independent engineering verification.</div>
<script src="shared.js"></script>
<script>
const FIELDS=['p_title','p_number','p_rev','p_project','p_equipment','p_component','p_drawing','p_prepared','p_checked','p_date','p_standard','p_loadcase','p_refs','p_assumptions'];
function loadProject(){
 const d=loadData();const p=d.project||{};
 FIELDS.forEach(id=>{if(p[id]!==undefined)document.getElementById(id).value=p[id]});
 if(!p.p_date)document.getElementById('p_date').value=new Date().toISOString().slice(0,10);
}
function saveProject(){
 const d=loadData();d.project=d.project||{};
 FIELDS.forEach(id=>d.project[id]=document.getElementById(id).value);
 saveData(d);
 flashSaved('savedMsg');
}
renderChrome('project');
loadProject();
</script>
</body>
</html>
