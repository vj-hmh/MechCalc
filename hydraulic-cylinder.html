<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hydraulic Cylinder Force — Mechanical Calculation Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app" id="appHeader"></header>
<nav class="crumbs" id="appNav"></nav>
<main>
<div id="globalError" class="errorbox"></div>
<div class="card"><h2>Hydraulic Cylinder Force</h2>
<div class="formula">Cap-End Piston Area: A<sub>cap</sub> = π × D² ÷ 4<br>Rod-Side Annular Area: A<sub>ann</sub> = π × (D² − d²) ÷ 4<br>Net Available Force: F<sub>net</sub> = (P<sub>cap</sub> × A<sub>cap</sub> − P<sub>rod</sub> × A<sub>ann</sub>) × η × n ÷ 1000</div>
<div class="grid">
<div class="field"><label>Bore diameter, D (in)</label><input type="number" id="hy_bore" step="any"></div>
<div class="field"><label>Rod diameter, d (in)</label><input type="number" id="hy_rod" step="any"></div>
<div class="field"><label>Cap pressure, Pcap (psi)</label><input type="number" id="hy_pcap" step="any"></div>
<div class="field"><label>Rod-side pressure, Prod (psi)</label><input type="number" id="hy_prod" value="0" step="any"></div>
<div class="field"><label>Efficiency, η (%)</label><input type="number" id="hy_eff" value="100" step="any"></div>
<div class="field"><label>Number of cylinders, n</label><input type="number" id="hy_count" value="1" min="1"></div>
<div class="field"><label>Required force, Freq (kip)</label><input type="number" id="hy_required" step="any"></div>
</div>
<p><button class="calcbtn" onclick="calcHydraulic()">Calculate Hydraulic Force</button></p>
<div id="hy_results" class="results"></div>
<p class="jump"><a href="calculation-report.html"><button class="ghost">View in Calculation Report</button></a></p>
</div>
</main>
<div class="footer">Prototype engineering aid. Results require independent engineering verification.</div>
<script src="shared.js"></script>
<script>
const FIELDS=['hy_bore','hy_rod','hy_pcap','hy_prod','hy_eff','hy_count','hy_required'];
const RULES=[
 {id:'hy_bore',label:'Bore diameter',exclusiveMin:0,max:60},
 {id:'hy_rod',label:'Rod diameter',min:0,max:60},
 {id:'hy_pcap',label:'Cap pressure',min:0,max:20000},
 {id:'hy_prod',label:'Rod-side pressure',required:false,min:0,max:20000},
 {id:'hy_eff',label:'Efficiency (%)',exclusiveMin:0,max:100},
 {id:'hy_count',label:'Number of cylinders',integer:true,min:1},
 {id:'hy_required',label:'Required force',required:false,min:0}
];
const val=id=>document.getElementById(id).value;
const gv=(r,s)=>r.vars.find(v=>v.symbol===s).value;
function resultsHTML(r){return box('Cap-End Area (Acap)',fmt(gv(r,'Acap'),4),'in²')+box('Rod-Side Area (Aann)',fmt(gv(r,'Aann'),4),'in²')+box('Net Available Force (Fnet)',fmt(r.allowable,4),'kip')+box('Required Force (Freq)',r.demand>0?fmt(r.demand):'Not entered','kip')+box('Utilization Factor (UF)',fmt(r.uf))+sbox(r.status)+ufGauge(r.uf)}
function restore(){const d=loadData();const inputs=(d.inputs||{});FIELDS.forEach(id=>{if(inputs[id]!==undefined)document.getElementById(id).value=inputs[id]});const saved=(d.results||{}).hydraulic;if(saved)document.getElementById('hy_results').innerHTML=resultsHTML(saved)}
function persistInputs(){const d=loadData();d.inputs=d.inputs||{};FIELDS.forEach(id=>d.inputs[id]=val(id));saveData(d)}
function calcHydraulic(){
 if(!validateForm(RULES).ok)return false;
 const D=Number(val('hy_bore')),d=Number(val('hy_rod')),Pc=Number(val('hy_pcap')),Pr=Number(val('hy_prod')),eta=Number(val('hy_eff'))/100,count=Number(val('hy_count')),req=Number(val('hy_required'));
 if(d>=D){showError('Rod diameter must be less than bore diameter.');return false}
 const Ac=Math.PI*D**2/4,Aa=Math.PI*(D**2-d**2)/4,Fnet=(Pc*Ac-Pr*Aa)*eta*count/1000,uf=req>0&&Fnet>0?req/Fnet:NaN;
 const vars=[variable('D','Cylinder Bore Diameter',D,'in','input'),variable('d','Rod Diameter',d,'in','input'),variable('Pcap','Cap-Side Pressure',Pc,'psi','input'),variable('Prod','Rod-Side Pressure',Pr,'psi','input'),variable('η','Mechanical / Hydraulic Efficiency',eta,'-','input'),variable('n','Number of Cylinders',count,'-','input'),variable('Freq','Required Force',req||'','kip','input'),variable('Acap','Cap-End Piston Area',Ac,'in²','calculated'),variable('Aann','Rod-Side Annular Area',Aa,'in²','calculated'),variable('Fnet','Net Available Force',Fnet,'kip','calculated'),variable('UF','Capacity Utilization Factor',uf,'-','calculated')];
 const steps=[
  step('Cap-End Piston Area','Acap = π × D² ÷ 4',`Acap = π × (${D} in)² ÷ 4`,`Acap = ${fmt(Ac,4)} in²`),
  step('Rod-Side Annular Area','Aann = π × (D² − d²) ÷ 4',`Aann = π × [(${D} in)² − (${d} in)²] ÷ 4`,`Aann = ${fmt(Aa,4)} in²`),
  step('Net Available Force','Fnet = (Pcap × Acap − Prod × Aann) × η × n ÷ 1000',`Fnet = (${Pc} psi × ${fmt(Ac,4)} in² − ${Pr} psi × ${fmt(Aa,4)} in²) × ${eta} × ${count} ÷ 1000`,`Fnet = ${fmt(Fnet,4)} kip`)];
 if(req>0)steps.push(step('Capacity Utilization Factor','UF = Freq ÷ Fnet',`UF = ${req} kip ÷ ${fmt(Fnet,4)} kip`,`UF = ${fmt(uf,3)} → ${status(uf)}`));
 const result={name:'Hydraulic force capacity',demand:req,allowable:Fnet,uf,unit:'kip',status:status(uf),vars,steps};
 document.getElementById('hy_results').innerHTML=resultsHTML(result);
 saveModuleResult('hydraulic',result);
 persistInputs();
 return true;
}
renderChrome('hydraulic');
markRequiredFields(RULES);
restore();
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',persistInputs));
</script>
</body>
</html>
